<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoPlaces — Create Shortcut</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-body">
  <div class="container narrow stack-lg">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">go/</div>
        <span class="brand-title">GoPlaces</span>
      </div>
      <a href="options.html" class="btn btn-sm">Dashboard</a>
    </header>

    <section class="card stack-lg">
      <div>
        <h2 class="section-title" id="heading">Shortcut not found</h2>
        <p class="muted" id="subtext">Create it right now and we’ll take you straight there.</p>
      </div>

      <form id="create-form" class="form-stack" autocomplete="off">
        <div class="input-group">
          <span class="input-prefix">go/</span>
          <input id="shortcut-input" type="text" placeholder="shortcut" required />
        </div>
        <input id="url-input" type="text" placeholder="https://example.com" required autofocus />
        <input id="note-input" type="text" placeholder="Optional label" maxlength="120" />
        <button type="submit" class="btn btn-primary">Save &amp; Go</button>
      </form>

      <div id="status-msg" class="status-msg" role="status"></div>
    </section>
  </div>

  <script type="module" src="notfound.js"></script>
</body>
</html>
